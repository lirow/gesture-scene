<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090e">
<meta name="description" content="Gesture Scene · 爱心与圣诞树粒子场景">
<link rel="icon" href="data:,">
<title>Gesture Scene · 粒子场景</title>
<style>
  :root { color-scheme: dark; --ink: #f2f4f6; --muted: #a8afb9; --line: #363940; --accent: #ff8dab; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #08090e; }
  body { color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
  button, a, input { -webkit-tap-highlight-color: transparent; }
  button, a { font: inherit; }
  button, .enter { min-height: 44px; border-radius: 6px; }
  button { color: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
  #stage { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  header { position: absolute; inset: max(28px, env(safe-area-inset-top)) 36px auto; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  h1 { font-size: 30px; font-weight: 550; line-height: 1.15; margin: 0; }
  .category { margin: 9px 0 0; font-size: 13px; color: var(--muted); }
  #status { padding-top: 8px; font-size: 12px; color: var(--muted); }
  #status::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 8px 2px 0; background: #88d4bc; border-radius: 50%; }
  .controls { position: absolute; bottom: max(32px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 48px)); }
  .caption { margin: 0 0 20px; text-align: center; }
  #scene-name { font-size: 19px; font-weight: 500; margin: 0; }
  .bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
  .themes { display: inline-flex; gap: 4px; width: max-content; }
  .themes button { padding: 0 16px; background: transparent; border: 1px solid transparent; font-size: 14px; }
  .themes button[aria-pressed="true"] { background: #20232a; border-color: #4d515a; }
  .themes button::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 9px 2px 0; background: #ff8dab; border-radius: 50%; }
  .themes button[data-theme="xmas2026"]::before { background: #b8dfaa; }
  .enter { display: inline-flex; justify-content: center; align-items: center; min-width: 132px; padding: 0 22px; background: var(--ink); color: #11141a; text-decoration: none; font-size: 14px; font-weight: 600; }
  .enter:hover { background: var(--accent); }
  .rotation { display: flex; align-items: center; justify-content: center; width: max-content; margin: 18px auto 0; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; min-height: 30px; }
  .rotation input { accent-color: #d5e0df; margin: 0; }
  #fallback { display: none; position: absolute; top: 45%; width: 100%; text-align: center; color: var(--muted); padding: 20px; }
  body.unavailable #fallback { display: block; }
  @media (max-width: 600px) {
    header { inset: max(24px, env(safe-area-inset-top)) 22px auto; }
    h1 { font-size: 25px; }
    #status { font-size: 11px; }
    .controls { bottom: max(22px, env(safe-area-inset-bottom)); width: calc(100% - 36px); }
    .bar { grid-template-columns: 1fr; justify-items: center; gap: 14px; padding-top: 16px; }
    .enter { width: 100%; }
    .caption { margin-bottom: 16px; }
    .rotation { margin-top: 12px; }
  }
  @media (max-height: 520px) {
    header { top: 18px; }
    h1 { font-size: 23px; }
    .controls { bottom: 14px; }
    .caption, .rotation { display: none; }
    .bar { padding-top: 10px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="交互式粒子场景"></canvas>
<header>
  <div><h1>Gesture Scene</h1><p class="category">粒子场景</p></div>
  <span id="status" role="status">准备中</span>
</header>
<p id="fallback">当前浏览器无法显示 3D 预览。</p>
<main class="controls">
  <div class="caption"><h2 id="scene-name">粉色爱心</h2></div>
  <div class="bar">
    <nav class="themes" aria-label="选择场景">
      <button type="button" data-theme="heart" aria-pressed="true">爱心</button>
      <button type="button" data-theme="xmas2026" aria-pressed="false">圣诞树</button>
    </nav>
    <a class="enter" id="enter" href="./scene.html?preset=heart">进入爱心场景</a>
  </div>
  <label class="rotation"><input id="rotate" type="checkbox" checked>自动旋转</label>
</main>
<noscript><p>需要启用 JavaScript 才能显示粒子场景。</p></noscript>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="./src/showcase.js"></script>
</body>
</html>
